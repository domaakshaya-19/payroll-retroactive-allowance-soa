spring.application.name=api-gateway
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
server.port=8080
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=localhost
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
eureka.client.service-url.defaultZone=https://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.home-page-url=https://localhost:${server.port}/
eureka.instance.status-page-url=https://localhost:${server.port}/
logging.level.org.springframework.security=INFO
logging.level.org.apache.http=WARN
logging.level.reactor.netty.http.client=WARN
payroll.cors-origins=${CORS_ORIGINS:https://localhost:3000}
payroll.jwt.public-key=${JWT_PUBLIC_KEY}
payroll.jwt.issuer=${JWT_ISSUER:https://localhost:8084}
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=allowance-rule-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://allowance-rule-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/allowances/**
spring.cloud.gateway.server.webflux.routes[2].id=pay-period-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://pay-period-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/pay-periods/**
spring.cloud.gateway.server.webflux.routes[3].id=retro-adjustment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://retro-adjustment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/retro-adjustments/**

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.loadbalancer.cache.ttl=2s
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=Retry
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.retries=1
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
