spring.application.name=allowance-rule-service
server.port=8081
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=localhost
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
eureka.client.service-url.defaultZone=https://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.home-page-url=https://localhost:${server.port}/
eureka.instance.status-page-url=https://localhost:${server.port}/
logging.level.org.springframework.security=INFO
logging.level.org.apache.http=WARN
logging.level.reactor.netty.http.client=WARN
payroll.cors-origins=${CORS_ORIGINS:https://localhost:3000}
payroll.jwt.public-key=${JWT_PUBLIC_KEY}
payroll.jwt.issuer=${JWT_ISSUER:https://localhost:8084}
spring.datasource.url=jdbc:h2:file:./data/allowance-rule-service/payroll;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${ALLOWANCE_DB_USER}
spring.datasource.password=${ALLOWANCE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

payroll.seed.enabled=${PAYROLL_SEED_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5


# Expected conflicts must not dump SQL values or employee IDs outside redacted audit logging.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
