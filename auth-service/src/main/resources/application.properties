spring.application.name=auth-service
payroll.auth.demo-enabled=${AUTH_DEMO_ENABLED:false}
server.port=8084
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=localhost
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
eureka.client.service-url.defaultZone=https://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.home-page-url=https://localhost:${server.port}/
eureka.instance.status-page-url=https://localhost:${server.port}/
logging.level.org.springframework.security=INFO
logging.level.org.apache.http=WARN
logging.level.reactor.netty.http.client=WARN
payroll.cors-origins=${CORS_ORIGINS:https://localhost:3000}
payroll.jwt.public-key=${JWT_PUBLIC_KEY}
payroll.jwt.issuer=${JWT_ISSUER:https://localhost:8084}
payroll.jwt.private-key=${JWT_PRIVATE_KEY}
payroll.auth.clerk-password=${CLERK_PASSWORD}
payroll.auth.approver-password=${APPROVER_PASSWORD}
payroll.auth.clerk-employees=${CLERK_EMPLOYEES:EMP001}
payroll.auth.approver-employees=${APPROVER_EMPLOYEES:EMP001}

payroll.auth.service-password=${RETRO_SERVICE_PASSWORD}
payroll.auth.service-employees=${RETRO_SERVICE_EMPLOYEES:EMP001}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

