# Both Retro replicas connect to this independently running Retro-owned H2 file store.
# The H2 server's base directory is restricted to data/retro-adjustment-service.
spring.datasource.url=jdbc:h2:tcp://localhost:9094/./payroll;LOCK_TIMEOUT=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
