spring.application.name=retro-adjustment-service
server.port=8083
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=localhost
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
eureka.client.service-url.defaultZone=https://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.home-page-url=https://localhost:${server.port}/
eureka.instance.status-page-url=https://localhost:${server.port}/
logging.level.org.springframework.security=INFO
logging.level.org.apache.http=WARN
logging.level.reactor.netty.http.client=WARN
payroll.cors-origins=${CORS_ORIGINS:https://localhost:3000}
payroll.jwt.public-key=${JWT_PUBLIC_KEY}
payroll.jwt.issuer=${JWT_ISSUER:https://localhost:8084}
spring.datasource.url=jdbc:h2:file:./data/retro-adjustment-service/payroll;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000
spring.datasource.username=${RETRO_DB_USER}
spring.datasource.password=${RETRO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=retro-audit-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
# Avoid framework failure logs that may render ConsumerRecord values or exception text.
logging.level.org.springframework.kafka.listener.DefaultErrorHandler=OFF
logging.level.org.springframework.kafka.listener.DeadLetterPublishingRecoverer=OFF

payroll.service.password=${RETRO_SERVICE_PASSWORD}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5

spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.listener.concurrency=1
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.consumer.client-id=retro-${server.port}

# Expected conflicts must not dump SQL values or employee IDs outside redacted audit logging.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
